[project]
name = "risb"
dynamic = ["version"]
description = "Rotationally invariant slave boson mean-field theory."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["quantum", "mean field", 'correlated electrons', 'quantum embedding', 'risb', 'slave bosons']
authors = [
  {name = "H. L. Nourse"}
]
dependencies = [
  "fockit>=0.4.1",
  "numpy",
  "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/thenoursehorse/risb"
Documentation = "https://thenoursehorse.github.io/risb"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.0.0"
build.targets.sdist.include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/CITATION.bib",
  "/CITATION.cff",
  "/COPYRIGHT",
]

[dependency-groups]
docs = [
  "furo",
  "myst-parser[linkify]",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-copybutton",
]
test = [
  "pytest >=9.0",
  "h5py",
  "matplotlib>=3.11.2",
]
dev = [
  {include-group = "test"},
  "mypy",
  "pre-commit",
  "ruff",
  "scipy-stubs",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error:::risb",
]
log_cli_level = "info"
testpaths = [
  "tests",
]

[tool.mypy]
files = ["src", "tests", "examples", "benchmarks"]
python_version = "3.14"
strict = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "explicit-override",
  "possibly-undefined",
]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["h5py.*"]
ignore_missing_imports = true

[tool.ruff]
src = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "TID251",      # flake8-tidy-imports.banned-api
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "D",           # pydocstyle
  "D204",        # one-blank-line-after-class
  "D301",        # escape-sequence-in-docstring
  "D413",        # blank-line-after-last-section
]
ignore = [
  "PLR",    # Design related pylint codes
  "RUF012", # Would require a lot of ClassVar's
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"
