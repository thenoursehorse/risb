name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    name: Test
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6

      - name: Setup TRIQS
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: risb
          cache-environment: true

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install risb
        run: UV_PROJECT_ENVIRONMENT=$CONDA_PREFIX uv sync --inexact --locked --extra docs

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test risb
        run: pytest

      - name: Test docs
        run: |
          sphinx-apidoc -o docs/api --module-first --no-toc --force --separate src/risb
          sphinx-build -b html -n -T docs docs/_build
