name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  bump-version:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      - name: Create a GitHub release
        if: steps.tag_version.outputs.new_tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  build-docs:
    needs: [bump-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup TRIQS
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: risb
          cache-environment: true

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install risb and docs dependencies
        run: UV_PROJECT_ENVIRONMENT=$CONDA_PREFIX uv sync --inexact --locked --no-dev --group docs

      - name: Build docs
        run: |
          sphinx-apidoc -o docs/api --module-first --no-toc --force --separate src/risb
          sphinx-build -b html -n -T docs docs/_build

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build

  deploy-docs:
    needs: [build-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    name: Deploy docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dist:
    needs: [bump-version]
    if: needs.bump-version.outputs.new_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: hynek/build-and-inspect-python-package@v2

  publish:
    needs: [dist]
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
